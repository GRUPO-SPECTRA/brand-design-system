name: Bootstrap Next.js security lockfile (temporary)

on:
  push:
    branches: [security/october-2026-hardening]
    paths:
      - package.json
      - .github/workflows/security-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  create-lockfile:
    if: github.repository == 'GRUPO-SPECTRA/brand-design-system' && github.ref == 'refs/heads/security/october-2026-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Generate reproducible Next.js lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched Next.js
        run: |
          node <<'NODE'
          const l = require('./package-lock.json');
          if (l.packages['node_modules/next']?.version !== '16.4.1') {
            throw new Error('Expected patched Next.js 16.4.1');
          }
          NODE
      - name: Install and build static site
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -f out/index.html
      - name: Commit lockfile and remove bootstrap job
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/security-lockfile-bootstrap.yml
          git commit -m "security: pin patched Next.js dependency tree"
          git push origin HEAD:security/october-2026-hardening
