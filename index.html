  <script>
    const brands={
      spectra:{name:'Spectra',full:'Spectra Minerais',concept:'Luz + matéria + tecnologia',role:'Luz',status:'Direção visual definida',description:'Uma identidade prismática, tecnológica e mineral. A cor nasce da refração da luz e nunca funciona como arco-íris decorativo.',palette:[['Black Mineral','#08090B'],['White Mineral','#F7F7F5'],['Violet','#7557FF'],['Blue','#3978FF'],['Cyan','#38D9FF'],['Green','#42E6A4'],['Yellow','#FFD65A'],['Orange','#FF875E'],['Magenta','#F058D7']],gradients:[['Prism Core','linear-gradient(115deg,#7557ff,#3978ff 22%,#38d9ff 42%,#42e6a4 60%,#ffd65a 76%,#ff875e 88%,#f058d7)'],['Cold Refraction','linear-gradient(125deg,#7557ff,#3978ff,#38d9ff,#42e6a4)'],['Warm Refraction','linear-gradient(125deg,#3978ff,#f058d7,#ff875e,#ffd65a)'],['Aurora Mineral','linear-gradient(125deg,#42e6a4,#38d9ff,#7557ff)']],display:'Manrope',ui:'Inter',photo:['Macro mineral','Refração real','Superfícies técnicas','Matéria em processo'],motion:'Movimentos lentos, ópticos e contínuos. Gradientes atravessam superfícies como luz; blur e glow são controlados e nunca prejudicam leitura.',layout:'Grid preciso, muito respiro, interfaces limpas, cards sólidos e efeitos prismáticos reservados para hierarquia e momentos de destaque.',icons:'Ícones lineares, geométricos, stroke consistente e poucos detalhes. Cor espectral apenas em estados ou destaques.',references:[['Maven Finance Management — Orbix Studio','https://www.behance.net/gallery/251881873/Maven-Finance-Management-Orbix-Studio-Mobile-App'],['Vectra — AI SaaS for e-commerce','https://www.behance.net/gallery/242757655/Vectra-AI-SaaS-product-for-e-commerce']]},
      sur:{name:'Sür',full:'Sür Gem Atelier',concept:'Metal + precisão + engenharia + luxo',role:'Matéria',status:'Direção visual definida',description:'Uma identidade monocromática, precisa e material. Preto e prata formam o sistema; metal, contraste e engenharia substituem efeitos cromáticos.',palette:[['Black','#080808'],['Graphite','#1A1A1C'],['Steel','#74777C'],['Silver','#C7C9CC'],['Platinum','#E4E5E6'],['White','#F6F6F3']],gradients:[['Polished Silver','linear-gradient(115deg,#161616,#cecece 34%,#606060 58%,#f1f1f1 78%,#2a2a2a)'],['Brushed Steel','linear-gradient(135deg,#090909,#62656a,#d9dadc,#686b70,#111)'],['Dark Chrome','linear-gradient(120deg,#070707,#242527,#8b8e93,#2b2c2f,#0b0b0b)']],display:'Space Grotesk',ui:'Inter',photo:['Metal polido','Detalhe técnico','Joia em processo','Contraste lateral'],motion:'Curto, preciso e mecânico. Transições lineares, reflexos que percorrem metal e deslocamentos mínimos. Evitar elasticidade e efeitos orgânicos.',layout:'Grids rigorosos, alinhamento técnico, áreas escuras amplas, linhas finas e componentes com baixo raio de borda.',icons:'Ícones técnicos e lineares, preferencialmente monocromáticos. Stroke fino e geometria precisa.',references:[]},
      ana:{name:'Ana Rios',full:'Ana Rios Joalheria',concept:'Joia + natureza + personalidade + autoria',role:'Emoção',status:'Direção visual inicial',description:'Um luxo mais humano, autoral e editorial. A base é quente e sofisticada; as gemas podem colorir coleções sem virar a identidade institucional inteira.',palette:[['Ivory','#F4EFE7'],['Wine','#4B1828'],['Mineral Rose','#B98A87'],['Champagne','#C7A56A'],['Chocolate','#302521'],['Warm Black','#191615']],gradients:[['Wine & Champagne','linear-gradient(125deg,#4b1828,#8a4255 42%,#b98a87 70%,#c7a56a)'],['Warm Editorial','linear-gradient(130deg,#191615,#4b1828,#c7a56a,#f4efe7)'],['Mineral Rose','linear-gradient(125deg,#302521,#b98a87,#f4efe7)']],display:'Cormorant Garamond',ui:'Inter',photo:['Pele e joia','Macro de gema','Sombras suaves','Composição editorial'],motion:'Suave e cinematográfico. Fade, deslocamento discreto, foco e aproximação. Nada tecnológico demais; o movimento deve parecer editorial.',layout:'Muito espaço negativo, imagens grandes, assimetria controlada, títulos serifados e ritmo semelhante a uma publicação de moda/joalheria.',icons:'Ícones muito discretos, finos e funcionais. A identidade deve depender mais de tipografia, composição e fotografia que de pictogramas.',references:[]}
    };

    const brandGroups=[
      ['Foundation',[['brand-core','01 · Brand Core'],['brand-strategy','02 · Brand Strategy'],['audience','03 · Audience'],['brand-personality','04 · Brand Personality']]],
      ['Language & Narrative',[['verbal-identity','05 · Verbal Identity'],['messaging-system','06 · Messaging System'],['storytelling','07 · Brand Storytelling']]],
      ['Visual Identity',[['visual-identity','08 · Visual Brand Identity'],['typography','09 · Typography'],['photography','10 · Photography Direction'],['illustration','11 · Illustration'],['iconography','12 · Iconography'],['graphic-language','13 · Graphic Language'],['layout','14 · Layout Principles'],['motion','15 · Motion Identity']]],
      ['Experience',[['sonic','16 · Sonic Identity'],['brand-experience','17 · Brand Experience'],['brand-in-action','18 · Brand in Action']]],
      ['AI & Governance',[['ai-guidelines','19 · AI Brand Guidelines'],['governance','20 · Brand Governance']]]
    ];
    const designGroups=[
      ['Foundations',[['grid','Layout Grid'],['spacing','Sizes & Spacing'],['typography','Typography'],['colors','Colours'],['icons','Icons'],['effects','Effects']]],
      ['Identity',[['logo','Logo'],['illustrations','Illustrations'],['avatars','Avatars']]],
      ['Actions & Controls',[['buttons','Buttons'],['icon-buttons','Icon Buttons'],['selection','Selection Controls'],['slider','Slider'],['tags','Tags']]],
      ['Navigation & Forms',[['navigation','Navigation'],['tabs','Tabs'],['header-links','Header Links'],['forms','Forms']]],
      ['Content & Feedback',[['cards','Cards'],['tables','Tables'],['modals','Modals & Popups'],['banners','Banners & Messaging']]]
    ];

    const state={brand:'spectra',mode:'brand',page:'overview'};
    const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
    const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const section=(kicker,title,body)=>`<section class="section"><div class="section-head"><div><div class="section-kicker">${kicker}</div><h2>${title}</h2></div></div>${body}</section>`;
    const head=(eyebrow,title,lead,status='Em definição')=>`<header class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1><p class="page-lead">${lead}</p></div><span class="status ${status.includes('definid')||status.includes('Aprovado')?'approved':''}">${status}</span></header><div class="prism-line"></div>`;

    function setBrand(id,navigate=true){if(!brands[id])return;state.brand=id;document.documentElement.dataset.brand=id;$$('.brand-option').forEach(b=>b.classList.toggle('active',b.dataset.brand===id));const b=brands[id];$('#brandContext').textContent=`${b.name.toUpperCase()} · ${b.role.toUpperCase()} / ${b.concept.toUpperCase()}`;if(id==='ana'&&!localStorage.getItem('themeTouched'))document.documentElement.dataset.theme='light';if(id==='sur'&&!localStorage.getItem('themeTouched'))document.documentElement.dataset.theme='dark';if(id==='spectra'&&!localStorage.getItem('themeTouched'))document.documentElement.dataset.theme='dark';renderNav();if(navigate)go(state.page);}
    function setMode(mode,navigate=true){state.mode=mode;$$('.mode-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#crumbMode').textContent=mode==='brand'?'Brand':'Design System';renderNav();if(navigate)go('overview');}
    function route(){const parts=location.hash.replace(/^#\//,'').split('/').filter(Boolean);if(parts.length>=3){state.mode=parts[0]==='design'?'design':'brand';state.brand=brands[parts[1]]?parts[1]:'spectra';state.page=parts.slice(2).join('/')||'overview'}else{state.page='overview'}setMode(state.mode,false);setBrand(state.brand,false);renderNav();renderPage();}
    function go(page){state.page=page;location.hash=`/${state.mode}/${state.brand}/${page}`;if(location.hash===`#/${state.mode}/${state.brand}/${page}`)renderPage();document.body.classList.remove('menu-open')}
    function renderNav(filter=''){const groups=state.mode==='brand'?brandGroups:designGroups;const q=filter.trim().toLowerCase();let html=`<a class="nav-link ${state.page==='overview'?'active':''}" href="#/${state.mode}/${state.brand}/overview">Overview</a>`;for(const [group,items] of groups){const visible=items.filter(([id,label])=>!q||label.toLowerCase().includes(q)||group.toLowerCase().includes(q));if(!visible.length)continue;html+=`<div class="nav-group">${group}</div>`+visible.map(([id,label])=>`<a class="nav-link ${state.page===id?'active':''}" href="#/${state.mode}/${state.brand}/${id}">${label}</a>`).join('')}$('#nav').innerHTML=html}

    function overview(){const b=brands[state.brand];return head('SPECTRA Brand Ecosystem','Um sistema. Três universos.','A estrutura de documentação é compartilhada. A expressão visual muda por marca para que cada negócio seja reconhecível sem perder a relação com o ecossistema.',b.status)+`<div class="brand-triad">${Object.entries(brands).map(([id,x],i)=>`<article class="card brand-card ${state.brand===id?'active':''}" data-target="${id}"><div class="number">0${i+1}</div><div class="word">${x.name}</div><div class="concept">${x.role} · ${x.concept}</div><div class="beam"></div></article>`).join('')}</div>`+section('Arquitetura','Luz → Matéria → Joia',`<div class="grid three"><div class="card"><div class="card-label">Spectra</div><h3>Luz</h3><p>A cor nasce da refração. Tecnologia, minerais, inovação e futuro.</p></div><div class="card"><div class="card-label">Sür</div><h3>Matéria</h3><p>Metal, precisão, manufatura, engenharia e performance.</p></div><div class="card"><div class="card-label">Ana Rios</div><h3>Emoção</h3><p>Autoria, joia, corpo, natureza, desejo e expressão pessoal.</p></div></div>`)+section('Princípio','Mesma estrutura, identidades independentes',`<div class="hero-visual"><div class="hero-orbit"></div><div class="hero-caption">${esc(b.concept)}</div></div><p class="section-copy" style="margin-top:18px">O shell de navegação, a hierarquia da documentação e a anatomia das páginas são comuns. Cores, tipografia, acabamentos, motion, fotografia e componentes adaptam-se a cada marca. O logo permanece fora desta fase: nenhuma nova assinatura está sendo proposta.</p>`)}

    function visualIdentity(){const b=brands[state.brand];return head('08 · Visual Identity',`Direção visual · ${b.name}`,b.description,b.status)+section('Conceito','Princípio visual central',`<div class="grid two"><div class="card"><div class="card-label">Território</div><h3>${b.concept}</h3><p>${b.layout}</p></div><div class="hero-visual"><div class="hero-orbit"></div><div class="hero-caption">${b.role}</div></div></div>`)+section('Sistema','Elementos que constroem reconhecimento',`<div class="grid four"><div class="card"><div class="card-label">Cor</div><h3>${b.palette.length} tons-base</h3><p>Paleta institucional e seus papéis no sistema.</p></div><div class="card"><div class="card-label">Tipo</div><h3>${b.display}</h3><p>Display combinado com ${b.ui} para interface e leitura.</p></div><div class="card"><div class="card-label">Imagem</div><h3>${b.photo[0]}</h3><p>${b.photo.join(' · ')}</p></div><div class="card"><div class="card-label">Motion</div><h3>Comportamento</h3><p>${b.motion}</p></div></div>`)+doDont(state.brand)}

    function colors(){const b=brands[state.brand];return head('Foundations / Colours',`Cores · ${b.name}`,'Paleta institucional, gradientes e regras de uso. O valor cromático sempre responde ao posicionamento da marca.',b.status)+section('Paleta','Cores institucionais',`<div class="swatches">${b.palette.map(([n,v])=>`<div class="swatch"><div class="swatch-color" style="background:${v}"></div><div class="swatch-meta"><div class="swatch-name">${n}</div><div class="swatch-value">${v}</div></div></div>`).join('')}</div>`)+section('Gradientes','Mistura e profundidade',`<div class="grid two">${b.gradients.map(([n,v])=>`<div class="gradient-sample" style="background:${v}"><span>${n}</span></div>`).join('')}</div><p class="section-copy" style="margin-top:18px">${state.brand==='spectra'?'Na Spectra, gradiente é refração: a transição precisa parecer luz atravessando matéria. Evitar rainbow linear sem profundidade, saturação total em grandes áreas e competição entre muitas cores na mesma interface.':state.brand==='sur'?'Na Sür, gradientes simulam metal, polimento e cromado. O sistema permanece estritamente monocromático.':'Na Ana Rios, os gradientes são raros e editoriais. Gemas podem introduzir cores sazonais nas coleções sem substituir a paleta institucional.'}</p>`)+tokensTable([['color.canvas',b.palette[0][1],'Canvas / fundo de marca'],['color.primary',b.palette[Math.min(2,b.palette.length-1)][1],'Acento principal'],['color.secondary',b.palette[Math.min(3,b.palette.length-1)][1],'Acento secundário'],['gradient.brand','brand-gradient','Destaques e superfícies especiais']])+doDont(state.brand)}

    function typography(){const b=brands[state.brand];return head('09 · Typography',`Tipografia · ${b.name}`,'Famílias, hierarquia e personalidade tipográfica para comunicação, editorial e produto.',b.status)+section('Specimen','Display + Interface',`<div class="type-specimen"><div class="type-display">${state.brand==='ana'?'A matéria encontra o gesto.':state.brand==='sur'?'PRECISION IN EVERY DETAIL.':'LIGHT BECOMES MATTER.'}</div><div class="type-ui">${b.display} sustenta títulos e momentos de personalidade. ${b.ui} assume interface, tabelas, legendas, formulários e textos longos para preservar clareza e consistência digital.</div></div>`)+section('Escala','Hierarquia recomendada',`<div class="grid four"><div class="card"><div class="card-label">Display</div><h3 style="font-family:var(--font-display);font-size:40px">Aa</h3><p>64–88px / destaque</p></div><div class="card"><div class="card-label">H1</div><h3 style="font-family:var(--font-display);font-size:34px">Aa</h3><p>44–64px / página</p></div><div class="card"><div class="card-label">H2</div><h3 style="font-family:var(--font-display);font-size:28px">Aa</h3><p>28–40px / seção</p></div><div class="card"><div class="card-label">Body</div><h3 style="font-family:var(--font-ui);font-size:20px">Aa</h3><p>14–18px / leitura</p></div></div>`)+tokensTable([['font.display',b.display,'Títulos e peças de marca'],['font.ui',b.ui,'Produto e conteúdo funcional'],['type.body','16px / 1.7','Corpo principal'],['type.caption','11px / 1.4','Metadados e labels']])}

    function photography(){const b=brands[state.brand];return head('10 · Photography Direction',`Fotografia · ${b.name}`,'Direção de imagem para campanhas, social, site, materiais comerciais e documentação.',b.status)+section('Direção','O que a imagem precisa comunicar',`<div class="photo-board">${b.photo.map(x=>`<div class="photo-block"><span class="photo-label">${x}</span></div>`).join('')}</div>`)+section('Princípios','Critérios de seleção',`<div class="grid three">${b.photo.map((x,i)=>`<div class="card"><div class="card-label">0${i+1}</div><h3>${x}</h3><p>${state.brand==='spectra'?'Luz deve revelar textura, transparência, refração ou processo.':state.brand==='sur'?'Luz deve esculpir forma, metal, precisão e acabamento.':'Imagem deve aproximar a joia da pessoa, do gesto, da pele e da história.'}</p></div>`).join('')}</div>`)+doDont(state.brand)}

    function iconography(){const b=brands[state.brand];return head('12 · Iconography',`Iconografia · ${b.name}`,'Sistema funcional de ícones. A identidade visual não depende dos ícones, mas eles devem respeitar o mesmo nível de precisão.',b.status)+section('Direção','Traço e comportamento',`<div class="grid two"><div class="card"><div class="card-label">Regra</div><h3>24px · stroke 1.5px</h3><p>${b.icons}</p></div><div class="demo-zone"><div class="demo-row" style="font-size:28px;gap:24px"><span>◇</span><span>○</span><span>⌁</span><span>↗</span><span>＋</span><span>⌕</span></div></div></div>`)+tokensTable([['icon.sm','16px','Ações compactas'],['icon.md','24px','Interface padrão'],['icon.lg','32px','Destaque funcional'],['icon.stroke','1.5px','Espessura recomendada']])}

    function graphicLanguage(){const b=brands[state.brand];return head('13 · Graphic Language',`Linguagem gráfica · ${b.name}`,'Formas, texturas, superfícies e recursos que tornam a marca reconhecível mesmo sem o logo.',b.status)+section('Assinatura','Elemento proprietário',`<div class="hero-visual"><div class="hero-orbit"></div><div class="hero-caption">${state.brand==='spectra'?'Refração / volume / luz':state.brand==='sur'?'Cromado / corte / precisão':'Camadas / papel / joia'}</div></div>`)+section('Regras','Como construir a linguagem',`<div class="grid three"><div class="card"><h3>Superfície</h3><p>${state.brand==='spectra'?'Vidro, cristal, blur controlado e planos translúcidos.':state.brand==='sur'?'Metal escovado, polido, preto técnico e linhas de usinagem.':'Papel, tecido, pele, pedra, ouro e superfícies com calor.'}</p></div><div class="card"><h3>Geometria</h3><p>${state.brand==='spectra'?'Volumes ópticos orgânicos sobre grid racional.':state.brand==='sur'?'Cortes retos, grids e detalhes técnicos.':'Assimetria editorial, enquadramentos e respiro.'}</p></div><div class="card"><h3>Intensidade</h3><p>${state.brand==='spectra'?'Efeito forte só em heros e pontos de atenção.':state.brand==='sur'?'Contraste alto e poucos elementos por composição.':'Luxo silencioso: menos elementos, maior intenção.'}</p></div></div>`)}

    function layoutPage(){const b=brands[state.brand];return head('14 · Layout Principles',`Layout · ${b.name}`,'Grid, respiro, proporção, hierarquia e ritmo para páginas digitais e peças de comunicação.',b.status)+section('Princípio','Composição',`<div class="grid two"><div class="card"><div class="card-label">Direção</div><h3>${b.layout}</h3><p>O sistema deve escalar de mobile a grandes telas sem perder o ritmo visual da marca.</p></div><div class="demo-zone"><div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:190px">${Array.from({length:12},(_,i)=>`<span style="background:var(--accent-soft);border:1px solid var(--border);border-radius:7px;opacity:${.45+(i%3)*.18}"></span>`).join('')}</div></div></div>`)+tokensTable([['grid.desktop','12 cols / 80px margin','Desktop amplo'],['grid.tablet','8 cols / 32px margin','Tablet'],['grid.mobile','4 cols / 16px margin','Mobile'],['space.base','8px','Escala base de espaçamento']])}

    function motion(){const b=brands[state.brand];return head('15 · Motion Identity',`Motion · ${b.name}`,'Movimento como extensão da personalidade da marca, nunca como efeito isolado.',b.status)+section('Demonstração','Tempo, matéria e resposta',`<div class="motion-stage"><div class="motion-beam"></div><div class="motion-glass"></div></div><p class="section-copy" style="margin-top:18px">${b.motion}</p>`)+tokensTable([['motion.fast','140–180ms','Controles e estados'],['motion.standard','220–320ms','Cards, tabs e navegação'],['motion.brand','600–1200ms','Momentos expressivos'],['easing.standard','cubic-bezier(.2,.7,.2,1)','Movimento de interface']])+section('Acessibilidade','Reduced motion',`<div class="card"><h3>Movimento nunca é requisito de compreensão.</h3><p>Respeitar <code>prefers-reduced-motion</code>, manter estados finais legíveis e evitar flashes, loops agressivos ou deslocamentos que prejudiquem foco e leitura.</p></div>`)}

    function genericBrand(page){const b=brands[state.brand];const names={
      'brand-core':['01 · Brand Core','Núcleo da marca','Propósito, visão, valores e essência que sustentam decisões futuras.'],
      'brand-strategy':['02 · Brand Strategy','Estratégia de marca','Posicionamento, diferenciação e território competitivo.'],
      'audience':['03 · Audience','Públicos','Segmentos, necessidades, comportamentos e contextos de decisão.'],
      'brand-personality':['04 · Brand Personality','Personalidade','Traços, atitudes e limites de expressão da marca.'],
      'verbal-identity':['05 · Verbal Identity','Identidade verbal','Voz, tom, vocabulário, ritmo e regras de escrita.'],
      'messaging-system':['06 · Messaging System','Sistema de mensagens','Hierarquia de mensagens institucionais, comerciais e funcionais.'],
      'storytelling':['07 · Brand Storytelling','Storytelling','Narrativas recorrentes, provas e histórias que constroem significado.'],
      'illustration':['11 · Illustration','Ilustração','Uso de recursos ilustrados, diagramas e elementos autorais.'],
      'sonic':['16 · Sonic Identity','Identidade sonora','Som, ritmo, assinatura e comportamento sonoro.'],
      'brand-experience':['17 · Brand Experience','Experiência de marca','Como a marca se comporta em pontos de contato físicos e digitais.'],
      'brand-in-action':['18 · Brand in Action','Marca em ação','Aplicações, campanhas, atendimento, produto e operação.'],
      'ai-guidelines':['19 · AI Brand Guidelines','IA & Marca','Regras para geração, revisão e uso responsável de conteúdo assistido por IA.'],
      'governance':['20 · Brand Governance','Governança','Responsáveis, aprovação, versionamento e evolução do sistema.']
    };const x=names[page]||['Brand','Página','Conteúdo em construção'];const isVisual=page==='illustration';return head(x[0],`${x[1]} · ${b.name}`,x[2],'Estrutura criada · conteúdo a validar')+section('Status','O que existe nesta etapa',`<div class="grid two"><div class="card"><div class="card-label">Definido</div><h3>${isVisual?b.concept:'Arquitetura da página'}</h3><p>${isVisual?'A ilustração deve obedecer à mesma direção de forma, material e cor do sistema visual.':'A estrutura segue a hierarquia do framework de referência, sem inventar decisões estratégicas que ainda não foram aprovadas.'}</p></div><div class="card soft"><div class="card-label">Próxima definição</div><h3>Conteúdo estratégico</h3><p>Preencher com evidências, decisões do planejamento e responsáveis. Hipóteses devem ser identificadas como hipótese, nunca como fato.</p></div></div>`)+section('Anatomia','Itens que esta página deve conter',`<div class="grid three"><div class="card"><h3>Definição</h3><p>Decisão final, contexto e objetivo.</p></div><div class="card"><h3>Evidência</h3><p>Dados, pesquisa, entrevistas, materiais e referências.</p></div><div class="card"><h3>Aplicação</h3><p>Como a decisão afeta conteúdo, design, produto e operação.</p></div></div>`)}

    function doDont(brand){const d=brand==='spectra'?['Usar cor como luz, refração e profundidade.','Evitar rainbow decorativo e gradiente em todos os elementos.']:brand==='sur'?['Usar preto, prata, metal e precisão.','Evitar cores saturadas e ornamentos sem função.']:['Usar calor, respiro e sofisticação editorial.','Evitar clichês de joalheria excessivamente dourados ou rebuscados.'];return section('Uso','Do / Don’t',`<div class="dos"><div class="do"><strong>DO</strong><p>${d[0]}</p></div><div class="dont"><strong>DON’T</strong><p>${d[1]}</p></div></div>`)}
    function tokensTable(rows){return section('Especificação','Tokens e valores',`<table class="token-table"><thead><tr><th>Token</th><th>Valor</th><th>Uso</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${r[0]}</code></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table>`)}

    function designOverview(){const b=brands[state.brand];return head('Design System',`Componentes · ${b.name}`,'O Design System usa a mesma arquitetura entre marcas, mas herda tokens, tipografia, cores, superfícies e motion específicos de cada universo.','Estrutura inicial')+section('Foundations','Da marca para o produto',`<div class="grid three"><div class="card"><h3>Cores</h3><p>${b.palette.slice(0,4).map(x=>x[0]).join(' · ')}</p></div><div class="card"><h3>Tipografia</h3><p>${b.display} + ${b.ui}</p></div><div class="card"><h3>Motion</h3><p>${b.motion}</p></div></div>`)+section('Arquitetura','Grupos do sistema',`<div class="grid three">${designGroups.map(([g,items])=>`<div class="card"><div class="card-label">${items.length} páginas</div><h3>${g}</h3><p>${items.map(x=>x[1]).join(' · ')}</p></div>`).join('')}</div>`)}

    function designPage(page){const b=brands[state.brand];if(page==='colors')return colors();if(page==='typography')return typography();if(page==='icons')return iconography();const info={grid:['Layout Grid','Grid responsivo que organiza páginas, componentes e alinhamentos.'],spacing:['Sizes & Spacing','Escala de medidas para ritmo, padding, gap e dimensões.'],effects:['Effects','Sombras, blur, bordas, overlays e profundidade.'],logo:['Logo','Assinaturas, área de proteção, fundos e tamanhos mínimos. O logo não será redesenhado nesta fase.'],illustrations:['Illustrations','Linguagem ilustrativa funcional e de apoio.'],avatars:['Avatars','Representação de pessoas e fallback.'],buttons:['Buttons','Hierarquia de ações com estados e tamanhos.'], 'icon-buttons':['Icon Buttons','Ações compactas com alvo acessível.'],selection:['Selection Controls','Checkbox, radio e toggle.'],slider:['Slider','Seleção contínua de valor ou intervalo.'],tags:['Tags','Status, filtros e categorias.'],navigation:['Navigation','Navegação principal e contextual.'],tabs:['Tabs','Navegação local entre conteúdos relacionados.'],'header-links':['Header Links','Links e ações textuais em headers.'],forms:['Forms','Campos, selects, textarea e validação.'],cards:['Cards','Contêineres para conteúdo e ação.'],tables:['Tables','Dados estruturados e ações por linha.'],modals:['Modals & Popups','Camadas temporárias para foco e decisão.'],banners:['Banners & Messaging','Feedback, alertas e mensagens de sistema.']};const x=info[page]||['Design System','Página de componente'];return head('Design System',`${x[0]} · ${b.name}`,x[1],'Especificação inicial')+designDemo(page,b)+tokensTable(componentTokens(page))+section('Responsividade','Comportamento',`<div class="grid three"><div class="card"><div class="card-label">Desktop</div><h3>1440</h3><p>Maior densidade, 12 colunas e navegação completa.</p></div><div class="card"><div class="card-label">Tablet</div><h3>768</h3><p>8 colunas, componentes adaptativos e redução de margens.</p></div><div class="card"><div class="card-label">Mobile</div><h3>390</h3><p>4 colunas, alvos de toque ≥ 44px e fluxo vertical.</p></div></div>`)+section('Acessibilidade','Regras mínimas',`<div class="card"><p>Contraste adequado, foco visível, semântica nativa quando possível, navegação por teclado, labels claros, estados não dependentes apenas de cor e suporte a reduced motion.</p></div>`)}

    function designDemo(page,b){let demo='';if(page==='buttons'||page==='icon-buttons')demo=`<div class="demo-row"><button class="button primary">Ação principal</button><button class="button secondary">Secundária</button><button class="button ghost">Terciária</button><button class="icon-button">↗</button></div>`;else if(page==='tags'||page==='banners')demo=`<div class="demo-row"><span class="tag brand">${b.name}</span><span class="tag">Neutro</span><span class="tag">Em produção</span><span class="tag">Concluído</span></div>`;else if(page==='forms'||page==='selection'||page==='slider')demo=`<div class="grid two"><div class="field"><label>Nome</label><input value="${b.name}" /></div><div class="field"><label>Categoria</label><select><option>Selecione</option><option selected>Marca</option></select></div></div>`;else if(page==='navigation'||page==='tabs'||page==='header-links')demo=`<div class="mini-nav"><a class="active">Overview</a><a>Produtos</a><a>Projetos</a><a>Contato</a></div>`;else if(page==='tables')demo=`<table class="table-demo"><thead><tr><th>Item</th><th>Status</th><th>Responsável</th></tr></thead><tbody><tr><td>Visual Identity</td><td>Definido</td><td>SPECTRA</td></tr><tr><td>Componentes</td><td>Em construção</td><td>Design</td></tr></tbody></table>`;else if(page==='cards')demo=`<div class="grid two"><div class="card"><div class="card-label">${b.role}</div><h3>${b.name}</h3><p>${b.description}</p></div><div class="card soft"><div class="card-label">Token</div><h3>${b.palette[2]?.[1]||b.palette[0][1]}</h3><p>Acento visual da marca.</p></div></div>`;else if(page==='grid')demo=`<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:6px;height:180px">${Array.from({length:12},()=>'<i style="background:var(--accent-soft);border:1px solid var(--border);border-radius:6px"></i>').join('')}</div>`;else if(page==='spacing')demo=`<div style="display:grid;gap:12px">${[4,8,12,16,24,32,48,64].map(n=>`<div style="display:flex;align-items:center;gap:12px"><code style="width:34px">${n}</code><i style="display:block;height:14px;width:${n*2}px;max-width:80%;background:var(--brand-gradient);border-radius:99px"></i></div>`).join('')}</div>`;else if(page==='effects')demo=`<div class="grid three"><div class="card" style="box-shadow:0 4px 12px rgba(0,0,0,.12)">Shadow 1</div><div class="card" style="box-shadow:0 16px 40px rgba(0,0,0,.20)">Shadow 2</div><div class="card" style="background:var(--brand-gradient-soft);backdrop-filter:blur(16px)">Brand surface</div></div>`;else if(page==='logo')demo=`<div class="empty"><strong>Logo preservado</strong><br><span>Nenhuma alteração de logo nesta fase. Inserir arquivos oficiais quando forem disponibilizados.</span></div>`;else if(page==='modals')demo=`<div class="card" style="max-width:520px;margin:auto;box-shadow:var(--shadow)"><div class="card-label">Confirmação</div><h3>Salvar alterações?</h3><p style="margin-bottom:18px">Exemplo visual de modal usando os tokens de ${b.name}.</p><div class="demo-row"><button class="button primary">Salvar</button><button class="button ghost">Cancelar</button></div></div>`;else demo=`<div class="empty">Demonstração visual será refinada conforme os assets oficiais da marca forem incorporados.</div>`;return section('Demonstração',xTitle(page),`<div class="demo-zone">${demo}</div>`)}
    function xTitle(page){return ({grid:'Estrutura responsiva',spacing:'Escala base',effects:'Profundidade e superfície',logo:'Uso institucional',buttons:'Hierarquia de ação',forms:'Entrada de dados',cards:'Conteúdo',tables:'Dados',navigation:'Orientação',tabs:'Contexto local',modals:'Camada de foco'}[page]||'Componente em contexto')}
    function componentTokens(page){const common=[['radius.control','10px','Controles'],['transition.standard','180ms','Estados'],['focus.ring','2px accent','Foco visível']];const map={grid:[['grid.desktop','12 col','Desktop'],['grid.tablet','8 col','Tablet'],['grid.mobile','4 col','Mobile']],spacing:[['space.1','4px','Micro'],['space.2','8px','Base'],['space.4','16px','Padrão'],['space.6','24px','Seções']],buttons:[['button.sm','32px','Small'],['button.md','40px','Medium'],['button.lg','48px','Large']],forms:[['field.md','40px','Input padrão'],['field.padding','12px','Padding interno']],cards:[['card.padding','24px','Padding'],['card.radius','18px','Raio']],tables:[['table.row','48px','Linha padrão']],navigation:[['nav.desktop','64px','Desktop'],['nav.mobile','56px','Mobile']],modals:[['modal.max','560px','Largura padrão']],tags:[['tag.height','28px','Altura']]};return [...(map[page]||[]),...common]}

    function renderPage(){const b=brands[state.brand];let html='';if(state.page==='overview')html=state.mode==='brand'?overview():designOverview();else if(state.mode==='brand'){const custom={ 'visual-identity':visualIdentity,typography,photography,iconography,'graphic-language':graphicLanguage,layout:layoutPage,motion};html=custom[state.page]?custom[state.page]():genericBrand(state.page)}else html=designPage(state.page);$('#app').innerHTML=html;const current=[...brandGroups.flatMap(x=>x[1]),...designGroups.flatMap(x=>x[1])].find(x=>x[0]===state.page);$('#pageTitle').textContent=state.page==='overview'?'Overview':current?.[1]||state.page;renderNav($('#navSearch').value);$$('.brand-card').forEach(card=>card.addEventListener('click',()=>setBrand(card.dataset.target)));$('#app').focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}

    $$('.brand-option').forEach(btn=>btn.addEventListener('click',()=>setBrand(btn.dataset.brand)));
    $$('.mode-tab').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));
    $('#navSearch').addEventListener('input',e=>renderNav(e.target.value));
    $('#themeButton').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('themeTouched','1');localStorage.setItem('theme',document.documentElement.dataset.theme)});
    $('#menuButton').addEventListener('click',()=>document.body.classList.toggle('menu-open'));
    $('#drawerBackdrop').addEventListener('click',()=>document.body.classList.remove('menu-open'));
    window.addEventListener('hashchange',route);
    const savedTheme=localStorage.getItem('theme');if(savedTheme)document.documentElement.dataset.theme=savedTheme;
    route();
  </script>
</body>
</html>
